<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✨ Звёздный кликер | Космическая коллекция ✨</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #0a0f2a, #03050b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Quicksand', system-ui, sans-serif;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* фоновые мерцающие звёзды */
        .bg-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-stars::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 15% 30%, #fff8, transparent),
                radial-gradient(3px 3px at 75% 60%, #ffea8f, transparent),
                radial-gradient(1px 1px at 90% 20%, #fff, transparent),
                radial-gradient(2px 2px at 40% 85%, #ffd966, transparent),
                radial-gradient(1.5px 1.5px at 55% 45%, #fff9, transparent);
            background-repeat: no-repeat;
            background-size: 250px 250px, 350px 350px, 180px 180px, 300px 300px, 200px 200px;
            opacity: 0.7;
            animation: starsTwinkle 5s infinite alternate;
        }

        @keyframes starsTwinkle {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            width: 100%;
            background: rgba(20, 25, 55, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 70px;
            border: 1px solid rgba(255, 235, 140, 0.4);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,215,0,0.2);
            padding: 24px 20px 36px;
            text-align: center;
        }

        .counter-box {
            background: linear-gradient(135deg, #1e1b3c, #110e2a);
            border-radius: 100px;
            margin: 0 16px 24px;
            padding: 12px 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,200,0.15);
            border-bottom: 2px solid #ffd966;
        }

        .counter-label {
            font-size: 0.9rem;
            letter-spacing: 3px;
            font-weight: 500;
            text-transform: uppercase;
            color: #ffefb9;
        }

        .counter-value {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE6A3, #FFC857);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255,200,80,0.5);
            line-height: 1.1;
            margin: 0;
        }

        .star-click-area {
            margin: 10px auto 20px;
            cursor: pointer;
        }

        .main-star {
            font-size: 11rem;
            filter: drop-shadow(0 0 15px #ffcc55) drop-shadow(0 0 30px #ffaa33);
            transition: transform 0.07s cubic-bezier(0.2, 1.4, 0.4, 1);
            cursor: pointer;
            display: inline-block;
            animation: starFloat 2.5s infinite alternate ease-in-out;
        }

        .main-star.pulse {
            transform: scale(0.88);
        }

        @keyframes starFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(3deg); }
        }

        .upgrade-section {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 50px;
            padding: 16px 12px;
            margin: 16px 8px 8px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,215,0,0.25);
        }

        .upgrade-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #ffecb3;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .upgrades-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .upgrade-item {
            background: linear-gradient(145deg, #262446, #19173b);
            border-radius: 50px;
            padding: 8px 16px 10px;
            min-width: 115px;
            flex: 1 0 auto;
            transition: all 0.1s;
            border: 1px solid #ffcf4a70;
            box-shadow: 0 4px 0 #0b0920;
            cursor: pointer;
        }

        .upgrade-item:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0b0920;
        }

        .upgrade-item.disabled {
            opacity: 0.55;
            filter: grayscale(0.3);
            pointer-events: none;
            transform: none;
        }

        .upgrade-name {
            font-weight: bold;
            font-size: 1rem;
            color: #FFE5A3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .upgrade-power {
            font-size: 0.7rem;
            background: #00000066;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 50px;
            margin-top: 5px;
            color: #ffd966;
        }

        .upgrade-price {
            font-size: 0.75rem;
            font-weight: bold;
            background: #2A254B;
            padding: 3px 10px;
            border-radius: 50px;
            margin-top: 6px;
            color: #FFB347;
        }

        .footer {
            font-size: 0.65rem;
            margin-top: 24px;
            color: #b9af86;
        }

        /* анимированные частицы-звёздочки */
        .star-particle {
            position: fixed;
            width: 14px;
            height: 14px;
            pointer-events: none;
            z-index: 10000;
            background: radial-gradient(circle, #ffe48f, #ffaa33);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: particleFly 0.6s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: scale(0.3) translate(var(--dx, 60px), var(--dy, -80px));
                opacity: 0;
            }
        }

        .float-number {
            position: fixed;
            font-weight: bold;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FFE6A3, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px gold;
            pointer-events: none;
            z-index: 10001;
            white-space: nowrap;
            animation: floatUp 0.8s forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0px) scale(0.8);
            }
            70% {
                opacity: 0.9;
                transform: translateY(-45px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateY(-95px) scale(0.6);
            }
        }

        @media (max-width: 500px) {
            .main-star { font-size: 7.5rem; }
            .counter-value { font-size: 3.4rem; }
            .upgrade-item { min-width: 100px; padding: 6px 10px; }
        }
    </style>
</head>
<body>
<div class="bg-stars"></div>

<div class="container">
    <div class="counter-box">
        <div class="counter-label">✨ собрано звёзд ✨</div>
        <div class="counter-value" id="scoreDisplay">0</div>
    </div>

    <div class="star-click-area">
        <div class="main-star" id="starButton">⭐</div>
    </div>

    <div class="upgrade-section">
        <div class="upgrade-title">🌀 звёздные усиления 🌀</div>
        <div class="upgrades-grid" id="upgradesList"></div>
    </div>
    <div class="footer">✨ нажимай на звезду — получай сияние ✨<br>🌟 улучшения увеличивают силу клика навсегда</div>
</div>

<script>
    (function(){
        // ---------- ИГРОВЫЕ ДАННЫЕ ----------
        let stars = 0;                // текущее количество звёзд
        let clickPower = 1;          // сила за клик

        // список улучшений
        const upgradesData = [
            { id: "sparkle", name: "Мерцание", emoji: "✨", basePrice: 20, power: 1 },
            { id: "glow",    name: "Сияние",   emoji: "🌟", basePrice: 85, power: 2 },
            { id: "nova",    name: "Нова",     emoji: "💫", basePrice: 320, power: 5 },
            { id: "galaxy",  name: "Галактика",emoji: "🌌", basePrice: 1400, power: 15 },
            { id: "cosmic",  name: "Космос",   emoji: "⚡", basePrice: 5800, power: 45 }
        ];

        // сколько куплено каждого улучшения
        let ownedUpgrades = {
            sparkle: 0,
            glow: 0,
            nova: 0,
            galaxy: 0,
            cosmic: 0
        };

        // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
        function getUpgradePrice(upgrade, count) {
            // формула: базовая цена + (кол-во купленных * базовая цена * 0.45)
            let increment = Math.floor(upgrade.basePrice * 0.45);
            return upgrade.basePrice + (count * increment);
        }

        // пересчёт силы клика
        function recalcClickPower() {
            let bonus = 0;
            for (let up of upgradesData) {
                let cnt = ownedUpgrades[up.id] || 0;
                bonus += up.power * cnt;
            }
            clickPower = 1 + bonus;
            return clickPower;
        }

        // отрисовка интерфейса (счёт + улучшения)
        function renderUI() {
            const scoreEl = document.getElementById("scoreDisplay");
            if (scoreEl) scoreEl.innerText = Math.floor(stars);
            
            const container = document.getElementById("upgradesList");
            if (!container) return;
            container.innerHTML = "";
            
            for (let up of upgradesData) {
                const owned = ownedUpgrades[up.id] || 0;
                const price = getUpgradePrice(up, owned);
                const canBuy = stars >= price;
                
                const card = document.createElement("div");
                card.className = `upgrade-item ${!canBuy ? "disabled" : ""}`;
                if (canBuy) {
                    card.style.cursor = "pointer";
                    card.addEventListener("click", (e) => {
                        e.stopPropagation();
                        buyUpgrade(up.id);
                    });
                }
                
                card.innerHTML = `
                    <div class="upgrade-name">${up.emoji} ${up.name} +${up.power}</div>
                    <div class="upgrade-power">уровень ${owned}</div>
                    <div class="upgrade-price">⭐ ${Math.floor(price)}</div>
                `;
                container.appendChild(card);
            }
        }

        // покупка улучшения
        function buyUpgrade(upgradeId) {
            const upgrade = upgradesData.find(u => u.id === upgradeId);
            if (!upgrade) return;
            
            const currentCount = ownedUpgrades[upgradeId] || 0;
            const price = getUpgradePrice(upgrade, currentCount);
            
            if (stars >= price) {
                stars -= price;
                ownedUpgrades[upgradeId] = currentCount + 1;
                recalcClickPower();
                renderUI();
                saveGame();
                
                // визуальный эффект покупки
                spawnFloatingText(`✨ ${upgrade.name} +${upgrade.power}`, "#FFD966");
                spawnParticles(12, true);
            } else {
                // недостаточно звёзд
                spawnFloatingText(`❄️ не хватает ${Math.floor(price - stars)} ❄️`, "#FFAA77");
                const starBtn = document.getElementById("starButton");
                if (starBtn) {
                    starBtn.style.transform = "scale(0.96)";
                    setTimeout(() => { if(starBtn) starBtn.style.transform = ""; }, 130);
                }
            }
        }

        // ---------- ЭФФЕКТЫ: ЧАСТИЦЫ И ВСПЛЫВАЮЩИЕ ЦИФРЫ ----------
        function spawnParticles(count = 8, randomScreen = false) {
            const starRect = document.getElementById("starButton")?.getBoundingClientRect();
            let centerX, centerY;
            
            if (starRect && !randomScreen) {
                centerX = starRect.left + starRect.width / 2;
                centerY = starRect.top + starRect.height / 2;
            } else {
                centerX = window.innerWidth / 2;
                centerY = window.innerHeight / 2;
            }
            
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 100;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - 30;
                
                const particle = document.createElement("div");
                particle.classList.add("star-particle");
                particle.style.left = (centerX - 7) + "px";
                particle.style.top = (centerY - 7) + "px";
                particle.style.setProperty("--dx", dx + "px");
                particle.style.setProperty("--dy", dy + "px");
                document.body.appendChild(particle);
                
                setTimeout(() => { if(particle && particle.remove) particle.remove(); }, 600);
            }
        }
        
        function spawnFloatingText(text, colorGradient = "#FFE484", customX = null, customY = null) {
            let x, y;
            const starElem = document.getElementById("starButton");
            if (customX && customY) {
                x = customX;
                y = customY;
            } else if (starElem) {
                const rect = starElem.getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top + rect.height / 2;
            } else {
                x = window.innerWidth / 2;
                y = window.innerHeight / 2;
            }
            
            const floatDiv = document.createElement("div");
            floatDiv.className = "float-number";
            floatDiv.innerText = text;
            floatDiv.style.left = (x - 35) + "px";
            floatDiv.style.top = (y - 30) + "px";
            floatDiv.style.background = `linear-gradient(135deg, ${colorGradient}, #FFB347)`;
            floatDiv.style.webkitBackgroundClip = "text";
            floatDiv.style.backgroundClip = "text";
            document.body.appendChild(floatDiv);
            
            setTimeout(() => { if(floatDiv && floatDiv.remove) floatDiv.remove(); }, 800);
        }
        
        // ---------- ОСНОВНОЙ КЛИК ПО ЗВЕЗДЕ ----------
        function onStarClick(event) {
            // получаем координаты клика для красивых эффектов
            let clickX = null, clickY = null;
            if (event && (event.clientX || event.touches)) {
                if (event.clientX) {
                    clickX = event.clientX;
                    clickY = event.clientY;
                } else if (event.touches && event.touches[0]) {
                    clickX = event.touches[0].clientX;
                    clickY = event.touches[0].clientY;
                }
            }
            
            // добавляем звёзды
            const gained = clickPower;
            stars += gained;
            
            // обновляем UI и сохранение
            renderUI();
            saveGame();
            
            // визуальный отклик: пульс звезды
            const starDiv = document.getElementById("starButton");
            if (starDiv) {
                starDiv.classList.add("pulse");
                setTimeout(() => starDiv.classList.remove("pulse"), 90);
            }
            
            // эффект +N
            if (clickX && clickY) {
                spawnFloatingText(`+${gained}`, "#FFE484", clickX, clickY);
            } else {
                spawnFloatingText(`+${gained}`, "#FFE484");
            }
            
            // россыпь маленьких звёздочек (частицы)
            const particleCount = Math.min(5 + Math.floor(gained / 3), 15);
            spawnParticles(particleCount, false);
        }
        
        // ---------- СОХРАНЕНИЕ / ЗАГРУЗКА ----------
        function saveGame() {
            try {
                const saveData = {
                    stars: Math.floor(stars),
                    upgrades: ownedUpgrades,
                    version: 2
                };
                localStorage.setItem("starclicker_save", JSON.stringify(saveData));
            } catch(e) { console.warn("save error"); }
        }
        
        function loadGame() {
            try {
                const raw = localStorage.getItem("starclicker_save");
                if (raw) {
                    const data = JSON.parse(raw);
                    if (typeof data.stars === "number") stars = data.stars;
                    if (data.upgrades) {
                        for (let key in ownedUpgrades) {
                            if (data.upgrades[key] !== undefined) {
                                ownedUpgrades[key] = data.upgrades[key];
                            }
                        }
                    }
                }
            } catch(e) { console.warn("load error"); }
            
            // фикс отрицательных значений
            if (stars < 0) stars = 0;
            recalcClickPower();
            renderUI();
        }
        
        // ---------- ПОДКЛЮЧЕНИЕ СОБЫТИЙ (mouse + touch) ----------
        function bindEvents() {
            const starBtn = document.getElementById("starButton");
            if (!starBtn) return;
            
            starBtn.addEventListener("click", (e) => {
                onStarClick(e);
            });
            
            starBtn.addEventListener("touchstart", (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY };
                    onStarClick(fakeEvent);
                } else {
                    onStarClick(null);
                }
            });
        }
        
        // --------- СТАРТ ----------
        loadGame();
        bindEvents();
        
        // мини-анимация приветствия
        setTimeout(() => {
            if (stars === 0 && clickPower === 1) {
                spawnFloatingText("✨ нажми на звезду ✨", "#FFD966");
            }
        }, 400);
    })();
</script>
</body>
</html>
